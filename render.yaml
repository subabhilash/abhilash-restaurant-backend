# Render Blueprint for the backend.
# Push this file to GitHub, then in Render dashboard:
#   New + → Blueprint → connect this repo → Apply.
#
# Set the secrets marked `sync: false` in the dashboard before first deploy.

services:
  - type: web
    name: admizo-backend
    runtime: python
    region: singapore         # closest to Neon ap-southeast-1
    plan: free                # free tier; upgrade to "starter" for always-on
    branch: main
    rootDir: .

    # Free tier doesn't support preDeployCommand — run migrations in buildCommand.
    # Migrations are idempotent, so re-running on every build is safe.
    # All env vars (including secrets) are available during Render builds.
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: gunicorn run:sio_app -c gunicorn.conf.py

    healthCheckPath: /health

    envVars:
      # Pin Python — Render defaults to 3.14 which lacks pydantic-core wheels
      - key: PYTHON_VERSION
        value: "3.11.10"
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: info
      - key: COOKIE_SECURE
        value: "true"
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: JWT_REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: GUNICORN_WORKERS
        value: "2"
      # ── Secrets (set manually in Render dashboard) ──────────────────────────
      - key: DATABASE_URL
        sync: false           # Use the Neon DIRECT (non-pooler) URL for migrations
      - key: JWT_SECRET_KEY
        sync: false           # Generate with: openssl rand -hex 32
      - key: CORS_ORIGINS
        sync: false           # https://your-frontend.onrender.com
      - key: FRONTEND_URL
        sync: false           # https://your-frontend.onrender.com
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
