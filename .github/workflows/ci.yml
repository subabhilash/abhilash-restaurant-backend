name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint, type-check, migrate
    runs-on: ubuntu-latest

    # Spin up a Postgres service container for migration testing
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test_db
      JWT_SECRET_KEY: ci-test-secret-32-chars-not-for-prod
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: 15
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: 7
      COOKIE_SECURE: "false"
      CORS_ORIGINS: http://localhost:3000
      FRONTEND_URL: http://localhost:3000
      APP_ENV: development
      DEBUG: "false"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest pytest-asyncio httpx

      - name: Lint with ruff (non-blocking warnings)
        run: ruff check app/ || true

      - name: Verify app imports
        run: python -c "from app.main import app; print('imports OK')"

      - name: Run migrations
        run: alembic upgrade head

      - name: Verify migration is reversible
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: Run tests (if any)
        run: |
          if [ -d tests ]; then
            pytest tests/ -v
          else
            echo "No tests/ directory yet — skipping"
          fi

  docker-build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: admizo-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
